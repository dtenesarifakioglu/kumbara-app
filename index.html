/* === Açılış ekranı (Paket C): CSS satır içi, font beklemez. Toplam 860 ms: gövde 0-260, kol 180-440, sikke 380-720, yazı 560-860 === */
#acilis{position:fixed;inset:0;z-index:100000;display:grid;place-items:center;background:var(--bg,#0E1116);color:var(--fg,#ECEEF3);transition:opacity .18s ease-out}
#acilis.kapan{opacity:0;pointer-events:none}
#acilis .aci-kutu{display:flex;flex-direction:column;align-items:center;gap:20px;transform:translateY(-4vh)}
#acilis .aci-ikon{width:112px;height:112px;display:block;overflow:visible}
#acilis .aci-yazi{font-family:"Sora","Figtree",system-ui,sans-serif;font-weight:600;font-size:22px;letter-spacing:-.01em;color:var(--fg,#ECEEF3);animation:aci-yazi .3s cubic-bezier(.2,.8,.2,1) .56s both}
#acilis .aci-govde{stroke-dasharray:1 2;animation:aci-ciz .26s cubic-bezier(.4,0,.2,1) both}
#acilis .aci-kol{stroke-dasharray:1 2;animation:aci-ciz .26s cubic-bezier(.4,0,.2,1) .18s both}
#acilis .aci-sikke{transform-box:fill-box;transform-origin:center;animation:aci-sikke .34s cubic-bezier(.3,1.5,.5,1) .38s both}
@keyframes aci-ciz{0%{stroke-dashoffset:1;opacity:0}1%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
@keyframes aci-sikke{from{opacity:0;transform:translateY(-36px) scale(.4)}to{opacity:1;transform:none}}
@keyframes aci-yazi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#acilis,#acilis *{animation:none!important;transition:none!important}}
</style>
<script>
/* Açılış zemini uygulamanın tema ayarıyla aynı kaynaktan (localStorage kasa.*) okunur; okunamazsa prefers-color-scheme.
   Mantık, aşağıdaki themeMode/skinD/skinL/curSkin ile birebir aynı tutulmalı. */
(function(){ var r = document.documentElement, g = function(k){ try { return localStorage.getItem(k); } catch(e) { return null; } };
  var LI = ['light','cloud','sand','mint','lilac','blush','stone'], DK = ['amoled','night','navy','forest','graphite','espresso','wine','plum','indigo','petrol','olive'];
  var sysDark = true; try { sysDark = !window.matchMedia || matchMedia('(prefers-color-scheme: dark)').matches; } catch(e) {}
  var m = g('kasa.mode') || 'auto', light = m === 'light' || (m === 'auto' && !sysDark), sk;
  if (light) { sk = g('kasa.skinL') || g('kasa.skin'); sk = sk && LI.indexOf(sk) >= 0 ? sk : 'light'; }
  else { sk = g('kasa.skinD') || g('kasa.skin'); sk = sk && DK.indexOf(sk) >= 0 ? sk : 'amoled'; }
  if (light) r.setAttribute('data-tone','light'); else r.removeAttribute('data-tone');
  if (sk === 'night') r.removeAttribute('data-skin'); else r.setAttribute('data-skin', sk); })();
</script>

<style>
/* Layout: tek sütun telefon kabuğu — üstte ay özeti, ortada sekme içeriği, altta sabit gezinme + ortada ekle düğmesi */
:root{
  --bg:#0E1116; --surface:#161A21; --surface2:#1E232C; --line:#272D38;
  --fg:#ECEEF3; --muted:#8C94A3; --faint:#5C6474;
  --accent:#F0B44C; --accent-ink:#1A1306;
  --inc:#4FD1A1; --exp:#FF8070; --warn:#F5C451;
  --k1:#6EA8FF; --k2:#F28DB6; --gold:#E9C46A;
  --f-display:"Sora","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark}
/* Temalar: cihaz başına seçilir */
:root[data-skin="amoled"]{--bg:#000000;--surface:#0E0E10;--surface2:#18181B;--line:#232327;--muted:#8B8F98;--faint:#5A5E66}
:root[data-skin="navy"]{--bg:#0A1120;--surface:#111A2D;--surface2:#19243C;--line:#243250;--muted:#8E9BB6;--faint:#5B6884}
:root[data-skin="forest"]{--bg:#0B1311;--surface:#121D1A;--surface2:#1A2824;--line:#253731;--muted:#8FA39C;--faint:#5C6F69}
:root[data-skin="graphite"]{--bg:#101112;--surface:#18191B;--surface2:#212325;--line:#2E3033;--muted:#9A9EA3;--faint:#63676C}
:root[data-skin="espresso"]{--bg:#120D0A;--surface:#1C1511;--surface2:#261C17;--line:#33261F;--muted:#A39286;--faint:#6E5F55}
:root[data-skin="wine"]{--bg:#140A0C;--surface:#201114;--surface2:#2B181C;--line:#3B2228;--muted:#AE9196;--faint:#765D62}
:root[data-skin="plum"]{--bg:#120B14;--surface:#1C1220;--surface2:#261A2B;--line:#35243B;--muted:#A493AB;--faint:#6D5C73}
:root[data-skin="indigo"]{--bg:#0B0B1A;--surface:#121226;--surface2:#1A1A33;--line:#262646;--muted:#9898BB;--faint:#626285}
:root[data-skin="petrol"]{--bg:#071315;--surface:#0D1D20;--surface2:#14282C;--line:#1F383D;--muted:#8BA6A9;--faint:#587477}
:root[data-skin="olive"]{--bg:#11120B;--surface:#1A1C12;--surface2:#23261A;--line:#313524;--muted:#A2A68E;--faint:#6C7058}
:root[data-tone="light"]{--fg:#17191E;--exp:#D8453A;--inc:#11905C;--warn:#B98500;--gold:#B07D12;--k1:#2F7BE6;--k2:#D9558C;color-scheme:light}
:root[data-skin="light"]{--bg:#F5F4F0;--surface:#FFFFFF;--surface2:#ECEAE4;--line:#DEDBD3;--muted:#676D78;--faint:#9AA0A9}
:root[data-skin="cloud"]{--bg:#F1F4F8;--surface:#FFFFFF;--surface2:#E6EBF2;--line:#D6DDE7;--muted:#5F6878;--faint:#97A0AE}
:root[data-skin="sand"]{--bg:#F5EFE6;--surface:#FFFCF7;--surface2:#ECE3D5;--line:#DDD0BD;--muted:#72675A;--faint:#A3988A}
:root[data-skin="mint"]{--bg:#EDF5F0;--surface:#FFFFFF;--surface2:#DFEBE4;--line:#CCDDD3;--muted:#5A6E65;--faint:#93A69D}
:root[data-skin="lilac"]{--bg:#F3F1F9;--surface:#FFFFFF;--surface2:#E7E3F1;--line:#D7D1E6;--muted:#68637E;--faint:#9E99B4}
:root[data-skin="blush"]{--bg:#F8F0F0;--surface:#FFFFFF;--surface2:#F0E3E3;--line:#E3D0D0;--muted:#776262;--faint:#AD9999}
:root[data-skin="stone"]{--bg:#EEEEEC;--surface:#FAFAF9;--surface2:#E3E3E0;--line:#D2D2CE;--muted:#62625E;--faint:#9A9A96}
:root[data-acc="teal"]{--accent:#3CC8BE;--accent-ink:#042321}
:root[data-acc="violet"]{--accent:#A88BFF;--accent-ink:#170C33}
:root[data-acc="coral"]{--accent:#FF8A6B;--accent-ink:#2C0D05}
:root[data-acc="sky"]{--accent:#5FB0FF;--accent-ink:#04182C}
:root[data-tone="light"]:not([data-acc]),:root[data-tone="light"][data-acc="gold"]{--accent:#C98A12;--accent-ink:#FFFFFF}
:root[data-tone="light"][data-acc="teal"]{--accent:#14968D;--accent-ink:#FFFFFF}
:root[data-tone="light"][data-acc="violet"]{--accent:#7656E0;--accent-ink:#FFFFFF}
:root[data-tone="light"][data-acc="coral"]{--accent:#E2603F;--accent-ink:#FFFFFF}
:root[data-tone="light"][data-acc="sky"]{--accent:#2F82D8;--accent-ink:#FFFFFF}
.skin{border-radius:14px;border:2px solid var(--line);padding:6px;text-align:left;display:flex;flex-direction:column;gap:8px}
.skin[aria-pressed="true"]{border-color:var(--accent)}
.skin .prev{height:44px;border-radius:8px;padding:7px;display:flex;flex-direction:column;gap:5px}
.skin .prev i{display:block;height:6px;border-radius:4px}
.skin b{font-size:12px}
.accs{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.acc{width:34px;height:34px;border-radius:50%;border:3px solid transparent;outline:2px solid transparent}
.acc[aria-pressed="true"]{border-color:var(--bg);outline-color:var(--fg)}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);overflow-x:clip}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.i{width:22px;height:22px;flex:none}

/* Üst bölüm */
.top{padding-block:12px 8px}
html,body{overflow-anchor:none}
body.kv #top{position:sticky;top:calc(var(--stk,-52px) + env(safe-area-inset-top,0px));z-index:20;background:var(--bg)}
body.kv #top::after{content:"";position:absolute;left:0;right:0;bottom:-18px;height:18px;background:linear-gradient(var(--bg) 55%,transparent);opacity:0;transition:opacity .2s;pointer-events:none}
body.kv #top.stuck::after{opacity:1}
body.kv #top.stuck .top{box-shadow:0 1px 0 color-mix(in srgb,var(--line) 70%,transparent)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:600;font-size:18px;display:flex;align-items:center;gap:10px}
.topline{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:nowrap}
.month{display:flex;align-items:center;gap:0;flex:none;margin-left:-6px}
.month .iconbtn{width:28px;height:30px}
.topline.tight .month b{font-size:13.5px;letter-spacing:-.01em}
.topline.tight .mbtn{padding:5px 4px}
.month b{min-width:0!important;padding:0 2px;white-space:nowrap}
.mbtn{display:flex;align-items:center;gap:4px;padding:5px 8px;border-radius:10px}
.mbtn:hover,.mbtn:active{background:var(--surface2)}
.mph{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:0 0 12px}.ypk{display:flex;align-items:center;justify-content:center;gap:4px}.ypk h3{margin:0;min-width:70px;text-align:center;font-size:20px;font-weight:700}
@keyframes sheen{from{transform:translateX(0) skewX(-18deg)}to{transform:translateX(var(--sx,600%)) skewX(-18deg)}}
.month b{font-family:var(--f-display);font-weight:600;font-size:15px;min-width:118px;text-align:center}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--surface2);color:var(--fg)}
.day .ex{color:var(--exp)}
.day .in{color:var(--inc)}
.sec{margin-top:22px}
main>.sec:first-child,main>.gtabs+.gbody>.sec:first-child{margin-top:14px}
.sech{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sech h2{font-family:var(--f-display);font-size:15px;font-weight:600;margin:0}

.who{font-weight:600}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.amt{font-weight:600;font-size:16px;white-space:nowrap;color:var(--exp)}
.amt.g{color:var(--inc)}
.row .rt{font-size:16px;line-height:1.3}
.row .rs{font-size:11.5px;gap:4px;margin-top:2px;color:color-mix(in srgb,var(--muted) 80%,var(--bg))}
.row .who{font-weight:500}
.sub svg{width:15px;height:15px;margin-left:-2px}
.fig{flex:none;display:block}

/* Kartlar */

.over{color:var(--exp)!important}
.split{display:flex;flex-direction:column;gap:10px}
.trend text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.6;border-radius:2px}
.set .rs{flex-wrap:nowrap;white-space:nowrap;min-width:0}

.btn.danger{color:var(--exp)}
a.lnk{color:var(--accent);font-size:12.5px;text-decoration:none}
a.lnk:hover{text-decoration:underline}

/* Ayarlar */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .rbody{display:flex;align-items:center;gap:10px}
.set .ic{width:34px;height:34px;border-radius:11px}

.inp{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:9px 11px;width:100%;min-width:0}

.inp.sm{width:110px;text-align:right}
.toggle{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--fg);transition:transform .15s}
.toggle[aria-checked="true"]{background:var(--inc)}

.note{font-size:13px;color:var(--muted);line-height:1.5}

/* Alt gezinme */
nav{position:fixed;border-top:1px solid var(--line);z-index:20}
nav .wrap{display:grid;align-items:center}
.nb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;transition:color .2s}
.nb svg{width:22px;height:22px;transition:transform .2s}
.nb::before{content:"";position:absolute;top:-1px;left:50%;width:0;height:3px;border-radius:0 0 4px 4px;background:var(--accent);transform:translateX(-50%);transition:width .25s ease;box-shadow:0 2px 12px color-mix(in srgb,var(--accent) 70%,transparent)}
.nb[aria-current="page"]::before{width:34px}
.navanim .nb[aria-current="page"]::before{animation:navLine .4s cubic-bezier(.2,.8,.2,1) both}
.navanim .nb[aria-current="page"] svg{animation:navIcon .4s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes navLine{from{width:0}}
@keyframes navIcon{0%{transform:translateY(3px) scale(.85)}100%{transform:translateY(-1px)}}
.nb[aria-current="page"] svg{transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){.nb,.nb svg,.nb::before{transition:none}}
.fab{color:var(--accent-ink);display:grid;place-items:center;justify-self:center}

/* Alt sayfa (sheet) */
.scrim{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);background:rgba(5,7,10,.62);z-index:40;display:flex;align-items:center;justify-content:center;padding:calc(10px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 10px max(10px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:22px;max-height:100%;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 18px;border:1px solid var(--line)}
.sheet .grab{display:none}
@keyframes up{from{transform:translateY(18px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes down{to{transform:translateY(14px) scale(.97);opacity:0}}
@keyframes scrimOut{to{background:rgba(5,7,10,0)}}
.scrim.in{animation:scrimIn .25s ease both}
.scrim.in .sheet{animation:up .32s cubic-bezier(.2,.9,.25,1.05) both}
.scrim.out{animation:scrimOut .19s ease both;pointer-events:none}
.scrim.out .sheet{animation:down .19s ease both}
@keyframes swapIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.shbody.swap{animation:swapIn .28s cubic-bezier(.2,.8,.2,1) both}
.swin{animation:swinK .34s cubic-bezier(.2,.8,.2,1) var(--sd,0ms) both}@keyframes swinK{from{opacity:0;transform:translateX(var(--sx,18px))}}
.tseg .seg.haspill{position:relative}.tseg .seg.haspill>button{position:relative;z-index:1;background:transparent!important;box-shadow:none!important;transition:color .3s}
.tspill{position:absolute;top:4px;bottom:4px;left:4px;border-radius:10px;z-index:0;transition:transform .34s cubic-bezier(.3,1.2,.4,1),width .34s cubic-bezier(.3,1.2,.4,1),background .3s,box-shadow .3s;background:color-mix(in srgb,var(--fg) 10%,var(--bg))}
.tseg.t-gider .tspill{background:color-mix(in srgb,var(--exp) 20%,var(--bg));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--exp) 45%,transparent)}

.tseg.t-led .tspill{background:color-mix(in srgb,var(--accent) 20%,var(--bg));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
@media (prefers-reduced-motion:reduce){.scrim.in,.scrim.in .sheet,.scrim.out,.scrim.out .sheet,.shbody.swap,.swin{animation:none}.tspill{transition:none}}

.pch b{font-size:13.5px;font-weight:700;letter-spacing:.01em}.pch small{min-width:18px;padding:1px 6px;border-radius:99px;font-size:10.5px;font-weight:700;text-align:center;color:var(--muted);background:color-mix(in srgb,var(--fg) 7%,transparent)}
.pcv{margin-left:auto;font-size:15px;font-weight:700;color:var(--fg)}

.pr.part .prk{border:1.6px solid color-mix(in srgb,var(--fg) 14%,transparent)}.pr.part .prk svg{width:26px;height:26px;margin:-1.6px;transform:rotate(-90deg)}.pr.part .prk circle{fill:none;stroke:var(--pc);stroke-width:2.6;stroke-linecap:round}

/* eşleme sayfası */
.plt{display:flex;align-items:center;gap:11px;padding:12px 14px;margin-bottom:12px;border-radius:14px;background:color-mix(in srgb,var(--fg) 4%,transparent)}.plt>span:not(.pli):not(.ic){flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.plt b{font-size:14.5px}.plt small{font-size:11.5px;color:var(--muted)}.plt>b.num{flex:none}

/* === Paket 3: sakin defter (görünüm katmanı) === */
/* İlke: her ekranda tek kahraman sayı; ikincil sayılar küçük ve soluk; çizgi yerine boşluk; renk yalnız anlam taşır.
   Yalnız mevcut tema değişkenleri kullanılır (--bg --surface --surface2 --line --fg --muted --faint --accent --inc --exp). */
:root{--p3-r:18px;--p3-gap:28px}

/* --- Kuruş: kuruşlu tutarda bile küçük ve soluk --- */
.mv .kr,.mv .dec{font-size:.72em;font-weight:500;opacity:.55;letter-spacing:0}
.mv .tl{opacity:.6}

/* --- Alt gezinme: opak çubuk + altında zemin rengi perde (arkasından içerik sızmaz) --- */
nav{background:var(--surface)!important;border-color:color-mix(in srgb,var(--fg) 8%,var(--line))!important;box-shadow:0 8px 28px -12px rgba(0,0,0,.45)!important}
nav::before{content:"";position:absolute;left:-14px;right:-14px;top:-26px;bottom:calc(-12px - env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 0%,transparent),var(--bg) 42%);z-index:-1;pointer-events:none}
main{padding-bottom:calc(132px + env(safe-area-inset-bottom,0px))!important}
.nb{min-height:44px}
/* Çevrimdışı: + düğmesi soluk, basınca doğru mesaj */
.fab.off{background:var(--surface2)!important;color:var(--muted)!important;box-shadow:none!important}

/* --- Üst satır: logo + ay seçici + arama; dokunma hedefleri 44px --- */
#top .month .iconbtn{width:40px;height:44px;border-radius:12px}
#top .tbtn{width:44px;height:44px;border-radius:14px}
#top .mbtn{min-height:44px}
.iconbtn{min-width:44px;min-height:44px;border-radius:14px}
@media (max-width:430px){#top .brand{font-size:0;gap:0}#top .brand .blogo{font-size:initial}}

/* --- Kahraman alanı: sakin; parıltı yok, gölge hafif --- */
.hero::after{display:none!important}
.hero{box-shadow:none!important;border-color:color-mix(in srgb,var(--fg) 9%,var(--line))!important;background:var(--surface)!important}
.hzl,.hnk{letter-spacing:0!important;text-transform:none!important;font-weight:600!important}
.hzl{color:var(--muted)!important}
.hzn{background:transparent!important;border-top-color:color-mix(in srgb,var(--fg) 7%,transparent)!important}
.hero:has(.hzv) .hzn{padding-block:10px 12px!important}
.hero:has(.hzv) .hnv{font-size:18px!important;font-weight:600!important;color:var(--fg)!important}
#top .hero.nneg:has(.hzv) .hnv{color:var(--exp)!important}
.hero:has(.hzv) .hnr{display:none}
.hero:has(.hzv) .hnl{flex-direction:row;align-items:baseline;gap:10px}
.hns{font-weight:500!important;color:var(--muted)}
.hns .up,.hns .dn{color:var(--muted)!important}.hns .up svg{color:var(--inc)}.hns .dn svg{color:var(--exp)}

/* --- Kayıtlar listesi: çizgisiz, boşlukla gruplanan günler --- */
#main .day{border-bottom:0!important;padding:22px 2px 4px!important}
#main .day b{font-size:13px!important;font-weight:600!important;color:var(--fg)}
#main .day .dyd{font-size:13px!important;color:var(--faint)!important}
#main .row{border-bottom:0!important;padding:9px 2px!important;gap:12px}
#main .row .ic{width:38px!important;height:38px!important;border-radius:12px!important}
#main .row .ic svg{width:19px!important;height:19px!important}
#main .row .rt{font-size:15px!important;font-weight:500!important}
#main .row .amt{font-size:15px!important;font-weight:600!important}
.amt:not(.g):not(.sv){color:var(--fg)}
.amt.g{color:var(--inc)}

/* Duyuru şeritleri (ekstre, öneri, yaklaşan): kart değil ince satır */
.sugb,.remb,.futb,.newbadge{margin-top:8px!important;padding:8px 10px!important;border-radius:14px!important;background:var(--surface)!important;border:1px solid color-mix(in srgb,var(--fg) 7%,transparent)!important;min-height:52px}
.sugb .futi,.remb .futi,.futb .futi{width:30px!important;height:30px!important;border-radius:10px!important}
.futt b{font-size:13.5px!important;font-weight:600!important}

/* Filtre çipi: görünür hap küçük, dokunma alanı 44px (saydam kenarlık) */
.fchip{min-height:44px;border:8px solid transparent!important;background-clip:padding-box!important;box-shadow:inset 0 0 0 1px var(--line);padding:2px 12px!important;margin:-8px 0}
.fchip[aria-pressed="true"]{box-shadow:none}
.fchips{gap:0!important;margin-left:-8px}

/* --- Kaydet: açık temada kontrast ≥4.5 (beyaz yazı, koyulaştırılmış zemin) --- */

const metaPick = d => { const sh = !!d.shared, mb = (act, v, on, c, l) => `<button type="button" data-act="${act}" data-v="${v}" aria-pressed="${on}"><i style="background:${c}"></i>${l}</button>`;
  const who = `<div class="field"><label>Ekleyen</label><div class="mseg">${['k1','k2'].map(k => mb('shby', k, !sh && d.by===k, PEOPLE[k].c, PEOPLE[k].n)).join('')}${mb('shshared', '', sh, 'var(--gold)', 'Ortak')}</div></div>`;

    <div class="vfls">${rw('n', S.inv.length > 1 ? 'Bugün yatırımda olan' : 'Bugün fonda olan', fmtT0(V0))}${rw('a', `${n} ay × ${fmtT0(X)}`, fmtT0(add))}${rw('g', S.inv.length > 1 ? 'Getirisi' : 'Fonun kazandıracağı', (g < 0 ? '−' : '+') + fmtT0(Math.abs(g)), g < 0 ? 'neg' : 'pos')}</div>
    <div class="vfa">${S.inv.length > 1 ? 'Yatırımların' : 'Fon'} son ${C.nm} ayda aylık ortalama <b class="num">%${fmt(C.r*100, 2)}</b> kazandırdı; aynı hızla sürerse bu tablo çıkar. Enflasyon düşülünce bugünkü alım gücüyle <b class="num">${fmtT0(C.real)}</b> eder.</div>`; }
function vFut(tv){ if (!S.inv.some(x => assetOf(x) && assetOf(x).monthly)) return ''; const X = +(S.vFutX ?? lsGet('kasa.fcalc') ?? 5000) || 0, n = S.vFutN || 12;
  return `<div class="sec"><div class="card vfut" data-v0="${tv}"><div class="toprow"><span class="eyebrow">Böyle giderse</span><span class="vseg">${[[6,'6 ay'],[12,'1 yıl'],[36,'3 yıl']].map(([k,l]) => `<button type="button" data-act="vfutn" data-v="${k}" aria-pressed="${k === n}">${l}</button>`).join('')}</span></div>
    <div class="vfx"><span>Ayda</span><b class="num" id="vfxv">${fmtT0(X)}</b><span>yatırırsan</span></div>
    <input type="range" class="vfr" id="vfr" min="0" max="30000" step="500" value="${X}" style="--p:${X/300}%" aria-label="Aylık yatırım">
    <div id="vfb">${vFutBody(tv)}</div></div></div>`; }
document.addEventListener('input', e => { const t = e.target; if (!t || t.id !== 'vfr') return; S.vFutX = +t.value; lsSet('kasa.fcalc', String(S.vFutX)); t.style.setProperty('--p', S.vFutX/300 + '%'); const c = t.closest('.vfut'); document.getElementById('vfxv').textContent = fmtT0(S.vFutX); document.getElementById('vfb').innerHTML = vFutBody(+c.dataset.v0||0); });
// Alımlar: zaman çizelgesi
// Eşik geçilince kısa kutlama
function vMile(tv){ const all = [5000,10000,15000,25000,50000,100000,250000,500000,1e6], pass = all.filter(v => v <= tv).pop() || 0, prev = lsGet('kasa.mile'); if (prev == null) { lsSet('kasa.mile', String(pass)); return; }
  if (pass > +prev) { lsSet('kasa.mile', String(pass)); if (navigator.webdriver) return; setTimeout(() => { const c = document.createElement('div'); c.className = 'vconf'; const cols = ['var(--accent)','var(--inc)','#7DB7FF','#E07BB5','#E7C46A'];
      c.innerHTML = Array.from({ length:36 }, (_, i) => `<i style="--x:${(Math.random()*200 - 100).toFixed(0)}vw;--r:${(Math.random()*720 - 360).toFixed(0)}deg;--t:${(1.4 + Math.random()*1.2).toFixed(2)}s;--l:${(Math.random()*100).toFixed(0)}%;background:${cols[i % 5]}"></i>`).join('');
      document.body.appendChild(c); setTimeout(() => c.remove(), 3200); buzz(); toast(`${fmtT0(pass)} eşiği geçildi`); }, 700); } }
function vVarlik(){ const fr = S.vFresh !== false; S.vFresh = false;
  if (S.status === 'loading') return `<div class="sec"><div class="empty">Yükleniyor…</div></div>`;
  if (!S.inv.length) return vSave(0, fr) + `<div class="sec"><div class="empty"><b>Yatırım yok</b>Fon, altın ya da hisse ekle; adet ve güncel fiyatla değeri hesaplanır.${S.canWrite ? `<div style="margin-top:14px"><button class="btn pri" data-act="newinv">${ico('plus')}Varlık ekle</button></div>` : ''}</div></div>`;
  const Hh = vHero(fr); try { vMile(Hh.tv); } catch (e) { console.error(e); }
  return Hh.h + safeSec(() => vSave(Hh.tv, fr)) + safeSec(() => vCal(Hh.A)) + safeSec(vAlt) + safeSec(() => vFut(Hh.tv)); }

</script>
